<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#000000">
<title>BADA · Alliance rules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bordo: #7A1424;
    --bordo-escuro: #5A0E1A;
    --bordo-claro: #F6E9EB;
    --preto: #000000;
    --texto: #1C1C1C;
    --cinza: #5F5F5F;
    --linha: #E6E1E2;
    --fundo: #FFFFFF;
    --display: "Barlow Condensed", "Noto Sans KR", "Arial Narrow", "Roboto Condensed", sans-serif;
    --corpo: "Barlow", "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: var(--corpo);
    font-size: 17px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--preto);
  }
  a { color: var(--bordo); }
  :focus-visible { outline: 3px solid var(--bordo); outline-offset: 2px; }

  /* Topo */
  .topo { background: var(--preto); color: #fff; padding: 16px 20px 0; overflow: hidden; }
  .topo-inner { max-width: 760px; margin: 0 auto; }
  .barra { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .idioma { position: relative; display: inline-flex; align-items: center; }
  .idioma::before {
    content: "🌐"; position: absolute; left: 12px; font-size: 1rem; pointer-events: none;
  }
  .idioma::after {
    content: ""; position: absolute; right: 14px; top: 50%;
    width: 8px; height: 8px; margin-top: -6px;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(45deg); pointer-events: none;
  }
  .idioma select {
    appearance: none; -webkit-appearance: none;
    min-height: 44px;
    padding: 0 38px 0 38px;
    background: var(--bordo); color: #fff;
    border: 0; border-radius: 999px;
    font-family: var(--corpo); font-weight: 600; font-size: 1rem;
    cursor: pointer;
  }
  .idioma select:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .idioma option { color: #000; background: #fff; }
  .marca {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 800;
    font-size: clamp(5.5rem, 30vw, 11rem);
    line-height: .8; letter-spacing: -.01em;
    margin: 0; color: #fff;
  }
  .lema {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(1.5rem, 6.5vw, 2.1rem); line-height: 1.1;
    margin: 14px 0 26px; color: #fff;
  }
  .marca-faixa { display: block; height: 14px; background: var(--bordo); margin: 0 -20px; }

  main { max-width: 760px; margin: 0 auto; padding: 0 20px 48px; }

  /* Regras */
  .regras { margin-top: 32px; }
  .regras > h2 {
    font-family: var(--display); font-weight: 700; font-size: 1.9rem;
    margin: 0 0 10px; color: var(--preto); line-height: 1.1;
  }
  .intro {
    margin: 0 0 8px; padding: 2px 0 2px 14px;
    border-left: 5px solid var(--bordo);
    font-size: 1.05rem; font-weight: 500; color: var(--preto);
  }
  .regra { padding: 14px 0 18px; }
  .regra:target { background: var(--bordo-claro); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
  .regra-cab { display: flex; align-items: flex-start; gap: 14px; }
  .num {
    flex: 0 0 auto; width: 46px; height: 46px;
    background: var(--bordo); color: #fff;
    font-family: var(--display); font-weight: 800; font-size: 1.6rem;
    display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .bloco-titulo {
    font-family: var(--display); font-weight: 700; font-size: 1.45rem;
    color: var(--bordo); margin: 36px 0 12px; line-height: 1.1;
  }
  .bloco-titulo:first-child { margin-top: 4px; }
  .regra h4 {
    flex: 1; font-family: var(--display); font-weight: 700; font-size: 1.55rem;
    line-height: 1.15; margin: 8px 0 0; color: var(--preto);
  }
  .regra ul { margin: 12px 0 0; padding-left: 20px; }
  .regra li { margin: 6px 0; }
  .regra li::marker { color: var(--bordo); }
  .regra strong { color: var(--bordo-escuro); }
  .regra code {
    display: block; margin-top: 8px; padding: 10px 12px;
    background: var(--bordo-claro); border-left: 4px solid var(--bordo); border-radius: 4px;
    font-family: var(--corpo); font-weight: 600; font-size: .95rem; line-height: 1.5; color: var(--preto);
  }
  .destaque {
    margin: 14px 0 0; padding: 12px 14px;
    border-left: 5px solid var(--bordo); background: var(--bordo-claro);
    font-weight: 600; color: var(--preto);
  }

  .consequencias { margin-top: 32px; padding: 22px 20px; background: var(--preto); color: #fff; border-radius: 8px; }
  .consequencias h2 { font-family: var(--display); font-size: 1.7rem; margin: 0 0 8px; line-height: 1.1; }
  .consequencias p { margin: 8px 0 0; color: #E4E4E4; }
  .consequencias ol { margin: 10px 0 0; padding-left: 22px; }
  .consequencias li::marker { color: #E07A8A; font-weight: 700; }

  footer { max-width: 760px; margin: 0 auto; padding: 0 20px 32px; color: var(--cinza); font-size: .9rem; }


</style>
</head>
<body>

<header class="topo">
  <div class="topo-inner">
    <div class="barra">
      <label class="idioma">
        <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" id="t-idioma">Idioma</span>
        <select id="idioma" aria-labelledby="t-idioma">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="ko">한국어</option>
          <option value="vi">Tiếng Việt</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
    </div>
    <h1 class="marca">BADA</h1>
    <p class="lema">Bada Bing Bada Boom</p>
  </div>
  <span class="marca-faixa" aria-hidden="true"></span>
</header>

<main>
  <section class="regras" aria-labelledby="t-regras">
    <h2 id="t-regras"></h2>
    <p class="intro" id="intro"></p>
    <div id="lista"></div>
  </section>

  <section class="consequencias" aria-labelledby="t-cons">
    <h2 id="t-cons"></h2>
    <p id="cons-intro"></p>
    <ol id="cons-passos"></ol>
    <p id="cons-grave"></p>
  </section>
</main>

<footer><p id="rodape"></p></footer>

      ["Kills pro Saison", ["Erreiche mindestens <strong>500.000 Kills pro Saison</strong>.", "Bis zum Start von Saison 5 musst du insgesamt mindestens <strong>750.000 Kills</strong> gesammelt haben.", "Kills können aus Einzelkills in den Vorsaisons oder aus koordinierten Kämpfen kommen. Starte keine Angriffe auf eigene Faust, die die Strategie der Führung stören könnten. Achte auf die Ankündigungen."]],
      ["Aktivität", ["<strong>24 Stunden ohne Login und ohne Abmeldung können zum Ausschluss führen</strong>.", "Du verreist oder bist länger weg? Sag nach Möglichkeit einem der R4 Bescheid.", "Aktiv sein heißt, bei den Allianzzielen mitzumachen, vor allem bei Kämpfen, und nicht nur einzuloggen und zu farmen.", "<strong>Bots sind im Spiel verboten</strong>, egal zu welchem Zweck."]],
      ["Saisonkämpfe", ["Nimm so oft wie möglich an geplanten Kämpfen teil und folge genau dem Plan, den die Führung mitteilt.", "Wir greifen in Wellen an: Du solltest wissen, wie das geht, und bei Bedarf den Zeitmarkierungen folgen.", "Wenn die Führung an anderen Tagen als im VS strategisch einen Schild verlangt, musst du geschützt sein und deinen Schild bis zum verlangten Zeitpunkt erneuern. Kauf dir deshalb 8-, 12- und 24-Stunden-Schilde im Allianzshop.", "Spieler, die im Schlamm kämpfen statt hinter dem Schild, bekommen bessere Bewertungen.", "Wir haben ein Ingenieursteam, deshalb ist die Fähigkeit zur Trümmerbeseitigung auf Maximalstufe wichtig.", "Geringe Teilnahme oder Missachtung der Pläne kann zum vorübergehenden oder dauerhaften Ausschluss führen."]],
      ["Position im Hive", ["Bleib auf der Position, die die Führung festgelegt hat.", "Teleportiere dich bei Verteidigungs- und Angriffsevents des Servers oder bei Angriffen auf die Allianz nicht und verlasse die Formation nicht ohne Erlaubnis."]],
      ["Schild am Buster Day", ["Wenn du nicht kämpfst, <strong>aktiviere und erneuere deinen Schild</strong> über den Tag.", "Wenn du Ingenieur bist, setze so oft wie möglich den Verbündetenschild ein, um Mitspieler ohne Schild zu schützen.", "Eine ungeschützte Basis gefährdet den Hive und schadet allen.", "Befolge zusätzliche Schild-Anweisungen der Führung."]],
      ["Canyon Storm & Desert Storm", ["Fordere immer den Kampf an (Option im Spiel anhaken), sobald die Anmeldung öffnet. Nur wer anfordert, kann für das Event eingeteilt werden.", "Wenn du dich angemeldet hast, <strong>sei dabei</strong>.", "Unentschuldigtes Fehlen kann dich von der nächsten Runde ausschließen.", "Etwas dazwischengekommen? Sag der Führung so früh wie möglich Bescheid.", "Sei großzügig: Wenn dir die Truppen ausgehen oder du im Kampf schon vorne liegst, frag, ob ein anderer Spieler dich ersetzen kann, damit er auch Punkte bekommt."]],
      ["Marshall & Zombie Siege", ["Tritt beim Marshall <strong>auf keinen Fall der ersten Rallye bei</strong>, damit Offline-Spieler ausgewählt werden und eine Mindestpunktzahl erreichen können.", "Halte bei der Zombie Siege <strong>deine Truppen immer auf der Mauer</strong>, damit deine automatische Teilnahme ebenfalls zählt."]],
      ["Zug", ["Der Zugführer wird nach der Leistung der Woche bestimmt, zum Beispiel als Punktbester, neben anderen Kriterien.", "Wer als Zugführer oder VIP ausgewählt wurde, hat eine <strong>Abklingzeit von 14 Tagen</strong>, bevor er erneut ausgewählt werden kann.", "In manchen Fällen können die Stärksten der Allianz als Zugwächter ausgewählt werden."]],
      ["Respekt", ["Behandle alle mit Respekt, unabhängig von Rang, Land oder Herkunft.", "Rassismus, Belästigung, Beleidigungen und persönliche Angriffe führen zum Ausschluss."]],
      ["Kommunikation mit der Führung", ["Kritik und Vorschläge sind willkommen, solange sie höflich sind.", "Sobald eine Entscheidung steht, ziehen alle mit."], "Widersprechen ist erlaubt. Respektlosigkeit nicht."],
      ["Benachrichtigungen und Discord", ["Aktiviere die Allianz-Benachrichtigungen auf deinem Handy.", "Lies immer die Allianzankündigungen, die Allianzpost und die Fireteam-Hinweise. Bleib informiert, was im Spiel passiert.", "„Ich habe die Ankündigung nicht gesehen“ ist keine Entschuldigung, eine Anweisung zu ignorieren.", "Tritt dem Discord der Allianz bei. Sprachchat während der Kämpfe hilft sehr, wenn es dir möglich ist."]]
    ],
    consTitulo: "Wenn Regeln nicht eingehalten werden",
    consIntro: "Die Führung prüft jeden Fall einzeln. Die Maßnahmen folgen meist dieser Reihenfolge:",
    consPassos: ["Verwarnung im Chat oder auf Discord", "Herabstufung oder Verlust des Platzes bei Events", "Ausschluss aus der Allianz für 24 Stunden", "Dauerhafter Ausschluss aus der Allianz"],
    consGrave: "Schwere Fälle (Respektlosigkeit, Inaktivität ohne Abmeldung) können direkt zum Ausschluss führen.",
    rodape: "Fragen? Sprich einen R4 oder R5 von BADA an."
  }
};

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var seletor = $('idioma');
  var T;

  function montar(lang) {
    T = TEXTOS[lang] || TEXTOS.pt;
    document.documentElement.lang = T.html;
    document.title = 'BADA · ' + T.subtitulo;
    $('t-idioma').textContent = T.idioma;
    $('intro').textContent = T.intro;
    $('t-regras').textContent = T.regrasTitulo;
    $('t-cons').textContent = T.consTitulo;
    $('cons-intro').textContent = T.consIntro;
    $('cons-grave').textContent = T.consGrave;
    $('rodape').textContent = T.rodape;

    $('cons-passos').innerHTML = T.consPassos.map(function (p) { return '<li>' + p + '</li>'; }).join('');

    var lista = '';
    T.regras.forEach(function (r, i) {
      var n = i + 1, id = 'regra-' + n;
      var b = [0, 5, 11].indexOf(i);
      if (b > -1) lista += '<h3 class="bloco-titulo">' + T.blocos[b] + '</h3>';
      lista += '<article class="regra" id="' + id + '">' +
        '<div class="regra-cab"><span class="num">' + n + '</span><h4>' + r[0] + '</h4></div>' +
        '<ul>' + r[1].map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>' +
        (r[2] ? '<p class="destaque">' + r[2] + '</p>' : '') +
        '</article>';
    });
    $('lista').innerHTML = lista;
  }

  // Idioma: escolha salva > inglês
  var salvo = null;
  try { salvo = localStorage.getItem('bada-idioma'); } catch (e) {}
  var inicial = TEXTOS[salvo] ? salvo : 'en';
  seletor.value = inicial;
  montar(inicial);

  seletor.addEventListener('change', function () {
    try { localStorage.setItem('bada-idioma', seletor.value); } catch (e) {}
    montar(seletor.value);
  });

  // Se abriu por um link de regra, vai até ela depois de montar a página
  if (location.hash) {
    var alvo = document.getElementById(location.hash.slice(1));
    if (alvo) alvo.scrollIntoView();
  }
})();
</script>
</body>
</html>
